# Coturn Configuration for Project Spectra
# RFC 5766 TURN server & RFC 5389 STUN server

listening-port=3478
tls-listening-port=5349

min-port=49152
max-port=65535

# Realm matching Settings.COTURN_REALM
realm=turn.spectra.chat

# Ephemeral credentials mechanism (TURN REST API - RFC 7635)
use-auth-secret
static-auth-secret=spectra-coturn-shared-hmac-secret-key-32b

# Security hardening
no-stdout-log
log-file=/var/log/turnserver.log
fingerprint
lt-cred-mech
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
